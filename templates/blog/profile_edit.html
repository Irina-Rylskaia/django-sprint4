{% extends "base.html" %}

{% block title %}
  Редактировать профиль
{% endblock %}

{% block content %}
  <h1 class="mb-4 text-center">Редактирование профиля</h1>

  <div class="card col-4 mx-auto">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Сохранить</button>
      </form>
    </div>
  </div>
{% endblock %}
